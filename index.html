<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語單字評量站</title>
<meta name="description" content="國小英語單字互動評量索引頁">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#E9F3FF; --surface:#FFFFFF; --surface2:#F4F9FF;
  --ink:#1B2A4A; --muted:#6A7C9B; --line:#CFE1F7;
  --accent:#2F7FF0; --accent-ink:#1A5FC4; --accent-soft:#DDEBFF;
  --good:#0FA059; --good-ink:#0A7C44; --good-soft:#D6F4E5;
  --amber:#E9760C; --amber-soft:#FFEBD4;
  --purple:#7B57E8; --purple-soft:#EBE4FF;
  --pink:#E5468F; --pink-soft:#FFE1EE;
  --on-accent:#FFFFFF;
  --shadow:0 2px 0 rgba(27,42,74,.06), 0 14px 30px -20px rgba(27,42,74,.55);
  --display:"Fredoka","Noto Sans TC",-apple-system,sans-serif;
  --body:"Nunito","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
  --han:"Noto Sans TC","Nunito",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink);
  background-color:var(--ground);
  background-image:
    radial-gradient(780px 420px at 8% -10%, #FFE7BF 0%, rgba(255,231,191,0) 62%),
    radial-gradient(700px 380px at 96% -2%, #E2DDFF 0%, rgba(226,221,255,0) 64%);
  background-repeat:no-repeat; background-attachment:fixed;
  font-family:var(--body); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px; margin:0 auto; padding:26px 18px 80px}
:focus-visible{outline:3px solid var(--amber); outline-offset:3px; border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.masthead{padding-bottom:18px; border-bottom:3px dotted var(--line); margin-bottom:20px}
.eyebrow{font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
h1{font-family:var(--display); font-size:clamp(32px,6.5vw,50px); font-weight:600; margin:4px 0 0; line-height:1.2; text-wrap:balance}
h1 b{font-weight:600; color:var(--accent)}
.sub{font-family:var(--han); font-size:14.5px; color:var(--muted); margin-top:6px}

/* 頁籤 Tab 樣式 */
.tab-nav{
  display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; margin:24px 0 10px;
  -webkit-overflow-scrolling:touch;
}
.tab-btn{
  background:var(--surface); border:2.5px solid var(--line); color:var(--ink);
  padding:9px 18px; border-radius:999px; font-family:var(--han); font-size:14.5px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap;
  transition:all .18s ease; box-shadow:0 2px 0 rgba(27,42,74,.05);
}
.tab-btn:hover{ border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
.tab-btn.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 10px rgba(47,127,240,.35);
}
.tab-btn .tab-count{
  font-size:12px; background:var(--accent-soft); color:var(--accent-ink);
  padding:2px 8px; border-radius:999px; font-weight:800;
}
.tab-btn.active .tab-count{
  background:#fff; color:var(--accent);
}

.groupbar{display:flex; align-items:center; gap:10px; margin:28px 0 14px}
.groupbar h2{font-family:var(--han); font-size:15px; font-weight:700; letter-spacing:.04em; color:var(--ink); margin:0; white-space:nowrap}
.groupbar::after{content:""; flex:1; height:3px; background:var(--line); border-radius:3px}
.count{font-family:var(--body); font-size:12px; font-weight:800; color:#fff; background:var(--accent); border-radius:999px; padding:3px 11px; font-variant-numeric:tabular-nums}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
.item{
  display:flex; flex-direction:column; gap:8px; text-decoration:none; color:inherit;
  background:var(--surface); border:3px solid var(--line); border-radius:20px;
  padding:20px 20px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  transition:transform .16s ease, border-color .16s ease;
}
.item::before{content:""; position:absolute; inset:0 0 auto 0; height:7px; background:var(--accent)}
.item:nth-child(3n+2)::before{background:var(--amber)}
.item:nth-child(3n+3)::before{background:var(--purple)}
.item:hover{transform:translateY(-4px); border-color:var(--accent)}
.item .unit{font-family:var(--body); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-top:4px}
.item h3{font-family:var(--display); font-size:24px; font-weight:600; margin:0; line-height:1.25}
.item p{font-family:var(--han); font-size:13.5px; color:var(--muted); margin:0; line-height:1.75}
.metas{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.meta{font-family:var(--han); font-size:11.5px; font-weight:700; color:var(--accent-ink); background:var(--accent-soft); border-radius:8px; padding:4px 9px}
.open{
  margin-top:auto; align-self:flex-start; margin-top:14px;
  font-family:var(--han); font-size:14px; font-weight:700; color:#fff; background:var(--accent);
  border-radius:999px; padding:8px 16px; display:flex; align-items:center; gap:7px;
  box-shadow:0 3px 0 var(--accent-ink);
}
.item:hover .open span{transform:translateX(4px)}
.open span{display:inline-block; transition:transform .16s ease}

.item.soon{border-style:dashed; background:var(--surface2); box-shadow:none; cursor:default}
.item.soon::before{background:var(--line)}
.item.soon:hover{transform:none; border-color:var(--line)}
.item.soon .unit,.item.soon h3{color:var(--muted)}
.item.soon .open{background:var(--line); color:var(--muted); box-shadow:none}

footer{margin-top:48px; padding-top:18px; border-top:3px dotted var(--line); font-family:var(--han); font-size:12.5px; color:var(--muted); line-height:1.9}
footer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; background:var(--purple-soft); color:var(--purple); border-radius:6px; padding:1px 6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <div class="eyebrow">Elementary English · Vocabulary Practice</div>
      <h1>英語<b>單字</b>評量站</h1>
      <div class="sub">點選上方年級分頁切換，點擊卡片即可開始練習單字。</div>
    </div>
  </header>

  <!-- 頁籤導覽列 -->
  <nav class="tab-nav" id="tabNav" aria-label="年級選擇"></nav>

  <!-- 卡片主呈現區 -->
  <main id="board"></main>

  <footer>
    國小英語自主複習平台 · 手機、平板、電腦皆可直接開啟。<br>
    要新增評量，將製作好的 <code>.html</code> 放進同資料夾，並在原始碼的 <code>PAGES</code> 清單增加一筆資料即可。
  </footer>
</div>

     unit:  "Unit 1 · G3U1W1 1-15",  // 卡片上方小標
     title: "Wolf! 1-15 單字闖關",    // 卡片大標題
     desc:  "15 個字詞、150 句全新例句。答完立刻看中文解釋。", // 說明
     metas: ["15 個字詞", "150 句例句"], // 標籤，可為空陣列 []
     file:  "5上/unit1_wolf-1-15.html"   // 檔名；若尚未完成填 null 會顯示「準備中」

    desc:  "15 個字詞、150 句全新例句。動詞要選對過去式，名詞要選對複數，答完立刻看中文解釋。",
    metas: ["15 個字詞", "150 句例句", "15 / 30 題可選"],

    desc:  "15 個字詞、150 句全新例句。動詞時態與名詞單複數變形，隨機抽題即測即評。",

/* ---------- 頁籤切換與渲染核心（免手動修改） ---------- */
(function(){
  const tabNav = document.getElementById('tabNav');
  const board = document.getElementById('board');

  // 取得所有不重複的 grade 列表
  const grades = [...new Set(PAGES.map(p => p.grade || "預設分組"))];
  let currentGrade = grades[0] || "";

  function renderTabs() {
    tabNav.innerHTML = '';
    grades.forEach(gName => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (gName === currentGrade ? ' active' : '');
      
      // 計算該年級中已完成 (file !== null) 的數量
      const liveCount = PAGES.filter(p => p.grade === gName && p.file).length;
      
      btn.innerHTML = `${gName} <span class="tab-count">${liveCount}</span>`;
      btn.onclick = () => {
        currentGrade = gName;
        renderTabs();
        renderCards();
      };
      tabNav.appendChild(btn);
    });
  }

  function renderCards() {
    board.innerHTML = '';
    const filteredPages = PAGES.filter(p => p.grade === currentGrade);

    // 依據 group 分組
    const groups = [];
    filteredPages.forEach(p => {
      let g = groups.find(x => x.name === p.group);
      if(!g){ g = {name: p.group, items: []}; groups.push(g); }
      g.items.push(p);
    });

    groups.forEach(g => {
      const ready = g.items.filter(i => i.file).length;
      const bar = document.createElement('div');
      bar.className = 'groupbar';
      bar.innerHTML = `<h2>${g.name}</h2><span class="count">${ready} 份已就緒</span>`;
      board.appendChild(bar);

      const grid = document.createElement('div');
      grid.className = 'grid';
      
      g.items.forEach(p => {
        const live = !!p.file;
        const card = document.createElement(live ? 'a' : 'div');
        card.className = 'item' + (live ? '' : ' soon');
        if(live) card.href = p.file;
        
        const metas = (p.metas || []).map(m => `<span class="meta">${m}</span>`).join('');
        card.innerHTML = `
          <div class="unit">${p.unit}</div>
          <h3>${p.title}</h3>
          <p>${p.desc}</p>
          ${metas ? `<div class="metas">${metas}</div>` : ''}
          <div class="open">${live ? '開始作答 <span>→</span>' : '準備中'}</div>
        `;
        grid.appendChild(card);
      });
      board.appendChild(grid);
    });
  }

  // 初始化
  renderTabs();
  renderCards();
})();
</script>
</body>
</html>
